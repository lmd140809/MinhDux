<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINH DUC — ADMIN PATCH SERVER</title>
<style>
  :root { --bg: #0a0508; --card: rgba(255,255,255,0.05); --gold: #ffc733; --red: #ff4d4d; --green: #4ade80; --text: #fff; --sub: #aaa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,199,51,0.2); }
  .header h1 { font-size: 22px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
  
  .card { background: var(--card); border: 1px solid rgba(255,199,51,0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 14px; color: var(--gold); margin-bottom: 15px; }
  label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 5px; font-weight: bold; }
  input[type="text"], input[type="password"], select { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 8px; color: var(--text); font-size: 14px; margin-bottom: 15px; outline: none; }
  input:focus { border-color: var(--gold); }
  
  .file-upload { border: 2px dashed var(--gold); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; background: rgba(255,199,51,0.05); }
  .file-upload input { display: none; }
  .file-upload p { color: var(--gold); font-size: 13px; font-weight: bold; }
  
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
  .btn-upload { background: linear-gradient(135deg, #ffc733, #ffeb99); color: black; }
  .btn:hover { opacity: 0.9; }
  
  .result { margin-top: 15px; padding: 15px; border-radius: 10px; font-size: 13px; display: none; white-space: pre-wrap; line-height: 1.5; }
  .result.success { background: rgba(74,222,128,0.15); border: 1px solid var(--green); color: var(--green); display: block; }
  .result.error { background: rgba(255,77,77,0.15); border: 1px solid var(--red); color: var(--red); display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>MINH DUC PATCH SERVER</h1></div>

  <!-- BẢO MẬT TOKEN -->
  <div class="card" style="border-color: var style="(--red);">
    <backgroundh2>🔑 Bước 1: Nhập GitHub Token</h2>
    <label>Yêu cầu Token Classic (Có quyền `repo`)</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxx">
    <button class="btn":#333; color:white;" onclick="saveToken()">LƯU TOKEN</button>
  </div>

  <!-- CẬP NHẬT PATCH -->
  <div class="card">
    <h2>📤 Bước 2: Cập nhật File Patch</h2>
    
    <label>Version (Phải tăng dần, VD: 1.0.2)</label>
    <input type="text" id="patchVersion" placeholder="VD: 1.0.2">

    <label>Tên hiển thị mới trên App (VD: Siêu Aim, Aim Head...)</label>
    <input type="text" id="patchDisplayName" placeholder="Nhập tên bạn muốn hiện trên nút bấm App...">
    
    <label>Chọn File (Chức năng) cần thay thế</label>
    <select id="patchFilename">
      <option value="OGIOS File (20).3105">File (20) - AimBody</option>
      <option value="OGIOS File (21).3105">File (21) - AimLock</option>
      <option value="OGIOS File (22).3105">File (22) - Antiban</option>
      <option value="OGIOS File (23).3105">File (23) - Nhẹ Tâm</option>
    </select>

    <div class="file-upload" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept=".3105" onchange="document.getElementById('fileName').textContent = 'Đã chọn: ' + this.files[0].name">
      <p id="fileName">Bấm để chọn file Patch (.3105) từ máy</p>
    </div>

    <button class="btn btn-upload" id="btnUpload" onclick="uploadPatch()">TẢI LÊN GITHUB</button>
    <div class="result" id="resultUpload"></div>
  </div>
</div>

<script>
  const CONFIG = { owner: "lmd140809", repo: "MinhDux" };
  
  function saveToken() { 
    localStorage.setItem('gh_token', document.getElementById('token').value.trim()); 
    alert('Đã lưu Token!'); 
  }
  function getToken() { return localStorage.getItem('gh_token') || ''; }
  
  function showResult(msg, type) {
    const el = document.getElementById('resultUpload');
    el.textContent = msg; el.className = `result ${type}`;
  }

  // ⚡ SỬ DỤNG XMLHTTPREQUEST ĐỂ TRÁNH LỖI FETCH CỦA SAFARI
  function xhrRequest(method, url, headers, body) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      for (const key in headers) {
        xhr.setRequestHeader(key, headers[key]);
      }
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(xhr.responseText ? JSON.parse(xhr.responseText) : null); } 
          catch(e) { resolve(xhr.responseText); }
        } else {
          reject(new Error(`Lỗi HTTP ${xhr.status}: ${xhr.responseText}`));
        }
      };
      xhr.onerror = () => reject(new Error("Lỗi kết nối mạng. Vui lòng kiểm tra lại 4G/Wi-Fi."));
      xhr.send(body);
    });
  }

  async function uploadPatch() {
    const token = getToken();
    const version = document.getElementById('patchVersion').value.trim();
    const displayName = document.getElementById('patchDisplayName').value.trim();
    const filename = document.getElementById('patchFilename').value;
    const file = document.getElementById('fileInput').files[0];

    if (!token) return showResult("❌ Vui lòng lưu Token trước!", "error");
    if (!version || !file) return showResult("❌ Vui lòng nhập Version và chọn file!", "error");

    document.getElementById('btnUpload').disabled = true;
    showResult("⏳ Đang kiểm tra Token và dọn dẹp bản cũ...", "success");

    try {
      const authHeaders = { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' };

      // 1. Tìm và XOÁ bản Release cũ của file này
      const releases = await xhrRequest('GET', `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases`, authHeaders);
      
      for (const rel of releases) {
        const hasFile = rel.assets.some(a => a.name === filename);
        if (hasFile) {
          await xhrRequest('DELETE', `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases/${rel.id}`, authHeaders);
        }
      }

      // 2. Tạo Release mới
      showResult("⏳ Đang tạo bản cập nhật mới...", "success");
      const tagName = `patch-${version}-${Date.now()}`;
      const releaseData = await xhrRequest('POST', `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases`, 
        { ...authHeaders, 'Content-Type': 'application/json' },
        JSON.stringify({ 
          tag_name: tagName, 
          name: `Update v${version}`, 
          body: displayName || "Cập nhật mới", 
          draft: false, prerelease: false 
        })
      );

      // 3. Upload file
      showResult("⏳ Đang tải file patch lên GitHub...", "success");
      
      // Đọc file thành dạng binary
      const reader = new FileReader();
      reader.readAsArrayBuffer(file);
      
      reader.onload = async () => {
        const arrayBuffer = reader.result;
        const uploadUrl = releaseData.upload_url.replace("{?name,label}", `?name=${encodeURIComponent(filename)}`);
        
        try {
          await xhrRequest('POST', uploadUrl, 
            { 'Authorization': `token ${token}`, 'Content-Type': 'application/octet-stream' },
            arrayBuffer
          );
          
          showResult(`✅ THÀNH CÔNG!\nĐã cập nhật file ${filename}.\nTên mới: ${displayName}\nBây giờ bạn mở App bấm Cập nhật là xong!`, "success");
          document.getElementById('patchDisplayName').value = "";
          document.getElementById('fileInput').value = "";
          document.getElementById('fileName').textContent = "Bấm để chọn file (.3105)";
        } catch (uploadErr) {
          showResult(`❌ Lỗi khi tải file: ${uploadErr.message}`, "error");
        } finally {
          document.getElementById('btnUpload').disabled = false;
        }
      };
      
      reader.onerror = () => {
        showResult("❌ Không thể đọc file từ máy!", "error");
        document.getElementById('btnUpload').disabled = false;
      };

    } catch (err) {
      showResult(`❌ ${err.message}`, "error");
      document.getElementById('btnUpload').disabled = false;
    }
  }
  window.onload = () => document.getElementById('token').value = getToken();
</script>
</body>
</html>
