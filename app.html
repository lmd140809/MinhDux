<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07080c">
<title>APP — SHOP MINHDUC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07080c;
  --bg-2:#0b0d13;
  --surface:#11141c;
  --surface-2:#161a24;
  --surface-3:#1c212e;
  --ink:#f2f4f8;
  --ink-light:#c8cedb;
  --muted:#7b8397;
  --muted-2:#565e72;
  --line:rgba(255,255,255,.06);
  --line-strong:rgba(255,255,255,.12);
  --line-glow:rgba(255,255,255,.18);
  --accent:#eab308;
  --accent-2:#f59e0b;
  --accent-glow:rgba(234,179,8,.35);
  --green:#10b981;
  --green-glow:rgba(16,185,129,.4);
  --cyan:#22d3ee;
  --zalo:#0068FF;--facebook:#1877F2;--tiktok:#fff;
  --radius-sm:14px;--radius-md:20px;--radius-lg:26px;--radius-xl:34px;
  --shadow-sm:0 1px 0 rgba(255,255,255,.04) inset,0 4px 14px rgba(0,0,0,.4);
  --shadow-md:0 1px 0 rgba(255,255,255,.05) inset,0 14px 40px rgba(0,0,0,.5);
  --shadow-lg:0 1px 0 rgba(255,255,255,.06) inset,0 28px 70px rgba(0,0,0,.6);
  --shadow-xl:0 20px 50px rgba(0,0,0,.7),0 40px 100px rgba(0,0,0,.55);
  --ease:cubic-bezier(.4,0,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  padding-bottom:120px;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;position:relative;line-height:1.5;
  min-height:100vh;
}

/* ============ AMBIENT ============ */
.ambient-bg{
  position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(1200px 800px at 100% -10%,rgba(234,179,8,.09),transparent 55%),
    radial-gradient(1000px 700px at -10% 110%,rgba(34,211,238,.07),transparent 55%),
    linear-gradient(180deg,#07080c 0%,#0b0d13 100%);
}
.ambient-bg::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 30%,transparent 80%);
}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.6;animation:float 24s infinite ease-in-out alternate}
.blob-1{width:480px;height:480px;background:radial-gradient(circle,rgba(234,179,8,.22),transparent 70%);top:-160px;left:-160px}
.blob-2{width:580px;height:580px;background:radial-gradient(circle,rgba(34,211,238,.16),transparent 70%);bottom:12%;right:-240px;animation-delay:-8s}
.blob-3{width:400px;height:400px;background:radial-gradient(circle,rgba(16,185,129,.10),transparent 70%);top:45%;left:35%;animation-delay:-14s;opacity:.45}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-50px) scale(1.08)}100%{transform:translate(-20px,40px) scale(.92)}}

/* ============ HEADING ============ */
.page-heading{
  padding:40px 20px 20px;display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;max-width:1180px;margin:0 auto;
}
.page-heading h1{
  font-family:'Sora',sans-serif;font-size:36px;font-weight:800;letter-spacing:-1.8px;line-height:1.02;
  background:linear-gradient(135deg,#ffffff 0%,#c8cedb 55%,#7b8397 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 40px rgba(234,179,8,.15);
}
.page-heading p{font-size:13px;color:var(--muted);margin-top:10px;font-weight:500}
.status-pill{
  display:inline-flex;align-items:center;gap:8px;padding:9px 15px;
  background:rgba(17,20,28,.72);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.08);border-radius:99px;
  font-size:11px;font-weight:700;color:var(--ink-light);letter-spacing:.3px;
  box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
  white-space:nowrap;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.22),0 0 12px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(16,185,129,.22),0 0 12px var(--green)}50%{box-shadow:0 0 0 6px rgba(16,185,129,.06),0 0 18px var(--green)}}

/* ============ STICKY ============ */
.sticky-top{
  position:sticky;top:0;z-index:90;padding:12px 16px;
  background:rgba(7,8,12,.72);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  transition:all .4s var(--ease);max-width:1180px;margin:0 auto;
  border-bottom:1px solid transparent;
}
.sticky-top.scrolled{background:rgba(7,8,12,.92);border-bottom-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.header-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
  border-radius:var(--radius-md);padding:12px 16px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.header-bar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
}
.brand{display:flex;align-items:center;gap:13px}
.brand-logo{
  width:48px;height:48px;flex-shrink:0;border-radius:14px;
  background:linear-gradient(145deg,#232833 0%,#0d0f15 100%);
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:700;letter-spacing:-.5px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.5),0 0 24px rgba(234,179,8,.15);
  position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);
}
.brand-logo::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(234,179,8,.3) 100%)}
.brand-logo::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.15),transparent 60%)}
.brand-name{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.brand-sub{font-size:10px;color:var(--muted);margin-top:4px;font-weight:700;letter-spacing:.6px;font-family:'JetBrains Mono',monospace}
.icon-btn{
  width:42px;height:42px;border-radius:13px;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--ink-light);transition:all .3s var(--ease);box-shadow:var(--shadow-sm);
}
.icon-btn:hover{background:var(--accent);color:#0a0b10;border-color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 24px var(--accent-glow)}
.icon-btn:active{transform:scale(.94)}

/* ============ SEARCH ============ */
.search-container{
  background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
  border-radius:var(--radius-md);margin-top:10px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:all .3s var(--ease);overflow:hidden;
}
.search-container:focus-within{border-color:rgba(234,179,8,.35);box-shadow:0 0 0 4px rgba(234,179,8,.06),var(--shadow-md)}
.search-bar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.search-icon{font-size:16px;opacity:.5;color:var(--accent)}
.search-bar input{width:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink)}
.search-bar input::placeholder{color:var(--muted-2);font-weight:500}
.clear-btn{border:none;background:var(--surface-3);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:11px;color:var(--ink-light);display:none;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.clear-btn.visible{display:flex}
.clear-btn:hover{background:var(--accent);color:#0a0b10}

/* ============ PRODUCTS ============ */
.product-section{padding:16px 16px 60px;max-width:1180px;margin:0 auto}
.section-title{font-size:13px;color:var(--muted);margin:0 6px 20px;font-weight:600;display:flex;align-items:center;gap:8px}
.section-title strong{color:var(--ink);font-weight:800}
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.product-card{
  background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
  border-radius:var(--radius-lg);padding:10px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;cursor:pointer;
  transition:transform .45s var(--ease-spring),box-shadow .45s var(--ease),border-color .45s var(--ease);
  position:relative;overflow:hidden;opacity:0;transform:translateY(20px);
  animation:cardIn .65s var(--ease-spring) forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.product-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);z-index:2;
}
.product-card::after{
  content:'';position:absolute;inset:0;border-radius:var(--radius-lg);
  pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,0);
  transition:box-shadow .45s var(--ease);
}
.product-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-xl),0 0 40px rgba(234,179,8,.08);border-color:var(--line-glow)}
.product-card:hover::after{box-shadow:inset 0 0 0 1px rgba(234,179,8,.18)}

.card-thumb-wrap{
  width:100%;aspect-ratio:16/11;position:relative;overflow:hidden;
  border-radius:var(--radius-md);background:linear-gradient(135deg,#1a1f2b 0%,#0f1219 100%);
  margin-bottom:14px;border:1px solid var(--line);
}
.card-thumb{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease);opacity:.94}
.product-card:hover .card-thumb{transform:scale(1.09);opacity:1}

.free-badge{
  position:absolute;top:10px;right:10px;
  background:linear-gradient(135deg,#10b981 0%,#059669 100%);
  color:#fff;border-radius:8px;padding:4px 10px;
  font-size:9px;font-weight:800;letter-spacing:.7px;
  font-family:'JetBrains Mono',monospace;
  box-shadow:0 6px 16px var(--green-glow),inset 0 1px 0 rgba(255,255,255,.25);
}
.card-tags{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;font-family:'JetBrains Mono',monospace}
.card-tags .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2)}
.card-title{
  font-family:'Sora',sans-serif;font-size:14.5px;font-weight:800;line-height:1.35;
  min-height:40px;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  letter-spacing:-.35px;color:var(--ink);
}
.card-desc{font-size:11.5px;line-height:1.55;color:var(--muted);min-height:36px;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-price{font-size:17px;font-weight:800;margin-top:auto;margin-bottom:14px;display:flex;align-items:baseline;gap:6px;letter-spacing:-.6px;font-family:'Sora',sans-serif}
.product-price::before{content:'0đ';font-size:17px;color:var(--ink)}
.product-price .free-tag{font-size:9px;font-weight:800;color:var(--green);background:rgba(16,185,129,.12);padding:4px 8px;border-radius:5px;margin-left:auto;letter-spacing:.4px;font-family:'JetBrains Mono',monospace;border:1px solid rgba(16,185,129,.2)}
.btn-view{
  width:100%;min-height:44px;
  background:linear-gradient(145deg,#232833 0%,#0d0f15 100%);
  color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 15px;font-family:inherit;font-size:12px;font-weight:700;
  text-decoration:none;transition:all .3s var(--ease);position:relative;overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
}
.btn-view::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 0%,rgba(234,179,8,.22) 100%);opacity:0;transition:opacity .3s}
.btn-view:hover::before{opacity:1}
.btn-view:hover{box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 20px var(--accent-glow);transform:translateY(-1px);border-color:rgba(234,179,8,.4)}
.btn-view span.arrow{font-size:16px;transition:transform .3s var(--ease-spring);position:relative;z-index:1}
.btn-view:hover span.arrow{transform:translateX(4px);color:var(--accent)}
.btn-view > span:first-child{position:relative;z-index:1}

/* ============ SKELETON ============ */
.skeleton-card{background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);border-radius:var(--radius-lg);padding:10px;border:1px solid var(--line)}
.sk-thumb{width:100%;aspect-ratio:16/11;border-radius:var(--radius-md);margin-bottom:14px}
.sk-line{height:11px;border-radius:6px;margin-bottom:9px}
.sk-line.short{width:55%}
.sk-line.medium{width:78%}
.shimmer{background:linear-gradient(90deg,#151923 25%,#1c212e 50%,#151923 75%);background-size:200% 100%;animation:shimmer 1.6s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.empty-state{grid-column:1/-1;background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);border-radius:var(--radius-lg);padding:56px 24px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.empty-icon{width:84px;height:84px;margin:0 auto 20px;border-radius:var(--radius-md);background:linear-gradient(145deg,#1a1f2b 0%,#0f1219 100%);display:flex;align-items:center;justify-content:center;font-size:36px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.empty-state h3{font-family:'Sora',sans-serif;font-size:16px;font-weight:800;margin-bottom:10px;color:var(--ink)}
.empty-state p{font-size:13px;color:var(--muted);line-height:1.65}

/* ============ BOTTOM NAV ============ */
.bottom-nav-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:360px;z-index:100}
.bottom-nav{
  background:rgba(17,20,28,.82);backdrop-filter:blur(32px) saturate(200%);
  -webkit-backdrop-filter:blur(32px) saturate(200%);
  border:1px solid rgba(255,255,255,.08);border-radius:42px;
  box-shadow:0 8px 24px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  display:grid;grid-template-columns:repeat(3,1fr);padding:7px;
}
.nav-item{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-weight:700;text-decoration:none;border-radius:32px;cursor:pointer;transition:all .38s var(--ease-spring);position:relative;overflow:hidden;padding:9px 0}
.nav-icon{width:20px;height:20px;transition:transform .35s var(--ease-spring)}
.nav-icon svg{width:100%;height:100%;stroke-width:2.2}
.nav-item.active{background:linear-gradient(145deg,var(--accent) 0%,var(--accent-2) 100%);color:#0a0b10;box-shadow:0 6px 18px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(-1px)}
.nav-item.active .nav-icon svg{stroke-width:2.4}
.nav-item:not(.active):hover{color:var(--ink);background:rgba(255,255,255,.04)}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(3,4,7,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:999;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:all .4s var(--ease)}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-content{
  width:100%;max-width:480px;
  background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  padding:16px 24px 42px;transform:translateY(100%);
  transition:transform .45s var(--ease-spring);
  box-shadow:0 -20px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;border-top:1px solid var(--line-glow);
}
.modal-overlay.active .modal-content{transform:translateY(0)}
.modal-content::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(to right,transparent,rgba(234,179,8,.08),transparent);transform:skewX(-25deg);animation:shine 4s infinite;pointer-events:none}
@keyframes shine{0%{left:-100%}15%{left:200%}100%{left:200%}}
.modal-drag{width:48px;height:5px;border-radius:99px;background:var(--surface-3);margin:0 auto 22px;cursor:grab}
.modal-header{text-align:center;margin-bottom:26px}
.modal-header h2{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.6px;margin-bottom:8px;color:var(--ink)}
.modal-header p{font-size:13px;color:var(--muted)}
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:26px}
.contact-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:15px 6px;border-radius:var(--radius-md);font-size:12px;font-weight:700;text-decoration:none;transition:all .3s var(--ease-spring);border:none}
.contact-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.btn-zalo{background:linear-gradient(135deg,rgba(0,104,255,.16) 0%,rgba(0,104,255,.06) 100%);color:#4d94ff;border:1px solid rgba(0,104,255,.28)}
.btn-zalo:hover{background:var(--zalo);color:#fff;border-color:var(--zalo);box-shadow:0 8px 24px rgba(0,104,255,.4)}
.btn-facebook{background:linear-gradient(135deg,rgba(24,119,242,.16) 0%,rgba(24,119,242,.06) 100%);color:#4d94ff;border:1px solid rgba(24,119,242,.28)}
.btn-facebook:hover{background:var(--facebook);color:#fff;border-color:var(--facebook);box-shadow:0 8px 24px rgba(24,119,242,.4)}
.btn-tiktok{background:linear-gradient(135deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 100%);color:#fff;border:1px solid rgba(255,255,255,.14)}
.btn-tiktok:hover{background:#000;color:#fff;border-color:rgba(255,255,255,.25);box-shadow:0 8px 24px rgba(255,255,255,.1)}
.price-section{margin-bottom:26px}
.price-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:14px;font-family:'JetBrains Mono',monospace}
.video-demo-wrap{width:100%;aspect-ratio:16/9;border-radius:var(--radius-md);background:linear-gradient(145deg,#232833 0%,#0d0f15 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line);transition:all .35s var(--ease)}
.video-demo-wrap:hover{transform:scale(1.02);box-shadow:var(--shadow-lg),0 0 40px rgba(234,179,8,.12);border-color:rgba(234,179,8,.3)}
.play-icon{width:58px;height:58px;border-radius:50%;background:rgba(234,179,8,.18);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid rgba(234,179,8,.4);transition:all .35s var(--ease-spring);box-shadow:0 0 30px rgba(234,179,8,.25)}
.video-demo-wrap:hover .play-icon{transform:scale(1.16);background:var(--accent);box-shadow:0 0 50px var(--accent-glow)}
.play-icon svg{width:22px;height:22px;fill:var(--accent);margin-left:3px;transition:fill .3s}
.video-demo-wrap:hover .play-icon svg{fill:#0a0b10}
.video-demo-wrap p{font-size:13px;font-weight:600;opacity:.92}

@media (min-width:768px){
  body{padding-bottom:60px}
  .page-heading h1{font-size:52px;letter-spacing:-2.6px}
  .product-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
  .bottom-nav-wrap{display:none}
  .modal-overlay{align-items:center}
  .modal-content{border-radius:var(--radius-xl);padding:34px;transform:scale(.95) translateY(20px)}
  .modal-overlay.active .modal-content{transform:scale(1) translateY(0)}
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}
::selection{background:rgba(234,179,8,.3);color:var(--ink)}
</style>
</head>

<body>

<div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<script>
const API_SERVER = {
    getAll: () => JSON.parse(localStorage.getItem('PRODUCTS_DATA') || '[]')
};
</script>

<div class="page-heading">
    <div>
        <h1>APP</h1>
        <p>Ứng dụng hỗ trợ Android &amp; iPhone miễn phí.</p>
    </div>
    <div class="status-pill">
        <span class="status-dot"></span>
        Online
    </div>
</div>

<div class="sticky-top" id="stickyTop">
    <div class="header-bar">
        <div class="brand">
            <div class="brand-logo">LMD</div>
            <div>
                <div class="brand-name">SHOP MINHDUC</div>
                <div class="brand-sub">// APP HUB</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="refreshBtn" title="Làm mới" aria-label="Làm mới">↻</button>
        </div>
    </div>

    <div class="search-container">
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Tìm app theo tên..." autocomplete="off">
            <button class="clear-btn" id="clearBtn" aria-label="Xoá tìm kiếm">✕</button>
        </div>
    </div>
</div>

<div class="product-section">
    <div class="section-title" id="productCount">
        <span class="shimmer" style="display:inline-block;width:120px;height:14px;border-radius:6px"></span>
    </div>
    <div class="product-grid" id="productGrid"></div>
</div>

<div class="bottom-nav-wrap">
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
            </span>
            <span>Cửa hàng</span>
        </a>
        <a href="app.html" class="nav-item active">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
            </span>
            <span>APP</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" id="contactNav">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </span>
            <span>Liên hệ</span>
        </a>
    </div>
</div>

<div class="modal-overlay" id="contactModal">
    <div class="modal-content">
        <div class="modal-drag" id="modalDrag"></div>
        <div class="modal-header">
            <h2>Liên Hệ &amp; Hỗ Trợ</h2>
            <p>Kết nối với chúng tôi để được hỗ trợ nhanh nhất</p>
        </div>
        <div class="contact-grid">
            <a href="https://zalo.me/0358648824" target="_blank" rel="noopener" class="contact-btn btn-zalo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.92 2 10.75c0 2.75 1.44 5.19 3.7 6.8-.15 1.36-.62 2.66-1.38 3.84-.22.34.15.78.52.59 1.5-.77 2.75-1.85 3.63-2.87 1.1.28 2.27.43 3.53.43 5.52 0 10-3.92 10-8.75S17.52 2 12 2z"/></svg>
                Zalo
            </a>
            <a href="https://www.facebook.com/share/18vA3fdnTn/?mibextid=wwXIfr" target="_blank" rel="noopener" class="contact-btn btn-facebook">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>
                Facebook
            </a>
            <a href="https://www.tiktok.com/@khoc1minh_r?_r=1&_t=ZS-9BNTCFFkkY0" target="_blank" rel="noopener" class="contact-btn btn-tiktok">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
                TikTok
            </a>
        </div>
        <div class="price-section" style="margin-bottom:0">
            <div class="price-title">Video Hướng Dẫn</div>
            <div class="video-demo-wrap" onclick="window.open('https://vt.tiktok.com/ZSpCx7t8A/','_blank')">
                <div class="play-icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
                <p>Xem Video Demo</p>
            </div>
        </div>
    </div>
</div>

<script>
function escapeHtml(str){const d=document.createElement('div');d.textContent=String(str??'');return d.innerHTML;}
function skeletonHTML(count=4){
    return Array.from({length:count}).map(()=>`
        <div class="skeleton-card">
            <div class="sk-thumb shimmer"></div>
            <div class="sk-line short shimmer"></div>
            <div class="sk-line medium shimmer"></div>
            <div class="sk-line shimmer"></div>
        </div>`).join('');
}

let allAppProducts = [];

function renderAppProducts(){
    const grid = document.getElementById('productGrid');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    let filtered = allAppProducts;

    if (searchTerm) {
        filtered = filtered.filter(p => {
            const name = String(p.name||'').toLowerCase();
            const desc = String(p.desc||'').toLowerCase();
            return name.includes(searchTerm) || desc.includes(searchTerm);
        });
    }

    const countEl = document.getElementById('productCount');
    countEl.innerHTML = searchTerm
        ? `Tìm thấy <strong>${filtered.length}</strong> app khớp với "${escapeHtml(searchTerm)}"`
        : `<strong>${filtered.length}</strong> app miễn phí`;

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📱</div>
                <h3>Chưa có app nào</h3>
                <p>Hiện chưa có ứng dụng trong mục APP. Vui lòng quay lại sau.</p>
            </div>`;
        return;
    }

    grid.innerHTML = filtered.map((p,i)=>{
        const id = encodeURIComponent(p.id ?? '');
        const name = escapeHtml(p.name || 'Ứng dụng');
        const desc = escapeHtml(p.desc || 'Ứng dụng miễn phí.');
        const img = escapeHtml(p.image || '');
        return `
            <article class="product-card" style="animation-delay:${Math.min(i*50,400)}ms"
                     onclick="window.location.href='detail.html?id=${id}'">
                <div class="card-thumb-wrap">
                    <img src="${img}" class="card-thumb" alt="${name}" loading="lazy"
                         onerror="this.style.opacity='0.2';this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 250%22%3E%3Crect fill=%22%231a1f2b%22 width=%22400%22 height=%22250%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%237b8397%22 font-size=%2220%22 font-family=%22monospace%22 font-weight=%22bold%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3ENO_IMAGE%3C/text%3E%3C/svg%3E'">
                    <div class="free-badge">FREE</div>
                </div>
                <div class="card-tags">
                    <span>APP</span><span class="dot"></span><span>Miễn phí</span>
                </div>
                <h3 class="card-title">${name}</h3>
                <p class="card-desc">${desc}</p>
                <div class="product-price"><span class="free-tag">FREE</span></div>
                <a href="detail.html?id=${id}" class="btn-view" onclick="event.stopPropagation()">
                    <span>Xem app</span><span class="arrow">→</span>
                </a>
            </article>`;
    }).join('');
}

function loadAppProducts(silent=false){
    const grid = document.getElementById('productGrid');
    if (!silent) grid.innerHTML = skeletonHTML(4);
    try {
        const all = API_SERVER.getAll() || [];
        allAppProducts = all.filter(p => String(p.category||'').toLowerCase() === 'app');
        renderAppProducts();
    } catch(e){
        console.error(e);
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Lỗi tải dữ liệu</h3><p>Vui lòng thử lại.</p></div>`;
    }
}

document.getElementById('searchInput').addEventListener('input', function(){
    document.getElementById('clearBtn').classList.toggle('visible', this.value.length>0);
    renderAppProducts();
});
document.getElementById('clearBtn').addEventListener('click', function(){
    const i = document.getElementById('searchInput');
    i.value=''; this.classList.remove('visible'); i.focus(); renderAppProducts();
});
document.getElementById('refreshBtn').addEventListener('click', function(){
    this.style.transform='rotate(360deg)';
    setTimeout(()=>this.style.transform='',400);
    loadAppProducts(true);
});

const stickyTop = document.getElementById('stickyTop');
window.addEventListener('scroll', ()=>stickyTop.classList.toggle('scrolled', window.scrollY>20), {passive:true});

/* Modal */
const modal = document.getElementById('contactModal');
const contactNav = document.getElementById('contactNav');
const modalDrag = document.getElementById('modalDrag');
function toggleModal(show){
    if (show){ modal.classList.add('active'); document.body.style.overflow='hidden'; }
    else { modal.classList.remove('active'); document.body.style.overflow=''; }
}
contactNav.addEventListener('click', ()=>toggleModal(true));
modal.addEventListener('click', e=>{ if (e.target===modal) toggleModal(false); });
let sY=0,cY=0,dr=false;
modalDrag.addEventListener('touchstart', e=>{ sY=e.touches[0].clientY; dr=true; modal.querySelector('.modal-content').style.transition='none'; });
modalDrag.addEventListener('touchmove', e=>{ if(!dr)return; cY=e.touches[0].clientY; const d=cY-sY; if(d>0) modal.querySelector('.modal-content').style.transform=`translateY(${d}px)`; });
modalDrag.addEventListener('touchend', ()=>{
    dr=false; const mc=modal.querySelector('.modal-content'); mc.style.transition='transform .45s var(--ease-spring)';
    if (cY-sY>100) toggleModal(false); else mc.style.transform='';
    sY=0;cY=0;
});

document.addEventListener('DOMContentLoaded', ()=>loadAppProducts());
</script>

</body>
</html>
