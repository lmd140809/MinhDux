<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<title>Chi Tiết File - SHOP VIPGONOPRO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
    --bg:#eceff3; --bg-soft:#f5f7fa; --card:#ffffff; --black:#131418;
    --text:#111318; --muted:#7b818c; --line:#e8eaee; --accent:#f5cf48; --green:#10b981;
    --shadow-sm:0 2px 8px rgba(17,19,24,.05);
    --shadow-md:0 8px 24px rgba(17,19,24,.08);
    --shadow-lg:0 20px 48px rgba(17,19,24,.14);
}
body {
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    padding-bottom:30px; -webkit-font-smoothing:antialiased;
}

/* TOP NAV */
.top-nav {
    padding:16px 16px 8px; display:flex; align-items:center; gap:14px;
    max-width:820px; margin:0 auto; position:sticky; top:0; z-index:50;
    background:rgba(236,239,243,.82); backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
}
.btn-back {
    width:44px; height:44px; background:var(--card); border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; color:var(--text); font-size:20px; font-weight:700;
    box-shadow:var(--shadow-sm); border:1px solid var(--line);
    transition:all .25s cubic-bezier(.4,0,.2,1);
}
.btn-back:hover { background:var(--black); color:#fff; transform:translateX(-2px); }
.top-title { font-weight:800; font-size:16px; letter-spacing:-.3px; }

/* CONTAINER */
.detail-container { padding:8px 16px; max-width:820px; margin:0 auto; }
.detail-card {
    background:var(--card); border-radius:26px; overflow:hidden;
    padding-bottom:26px; box-shadow:var(--shadow-md); border:1px solid var(--line);
    animation:cardIn .5s cubic-bezier(.22,1,.36,1);
}
@keyframes cardIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

/* THUMB */
.thumb-wrap { position:relative; width:100%; aspect-ratio:16/10; background:#151517; }
.thumb-img { width:100%; height:100%; object-fit:cover; }
.buyer-badge {
    position:absolute; top:16px; left:16px;
    background:rgba(15,16,20,.75); color:#fff; padding:8px 12px; border-radius:10px;
    font-size:12px; font-weight:800; backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); letter-spacing:.3px;
}
.free-badge-lg {
    position:absolute; top:16px; right:16px;
    background:linear-gradient(135deg,#16a36a 0%,#10b981 100%);
    color:#fff; padding:7px 11px; border-radius:9px; font-size:11px; font-weight:800;
    letter-spacing:.4px; box-shadow:0 4px 14px rgba(16,185,129,.4);
}

/* CONTENT */
.detail-content { padding:22px; }
.tags { display:flex; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:14px; font-weight:600; }
.tags span.free { color:var(--green); font-weight:800; }
.title { font-size:23px; font-weight:900; margin-bottom:12px; line-height:1.35; letter-spacing:-.5px; }
.desc { font-size:14.5px; color:var(--muted); margin-bottom:22px; line-height:1.65; }

.price-box {
    margin-bottom:22px; background:linear-gradient(135deg,#eff6ff 0%,#e0eaff 100%);
    padding:18px; border-radius:14px; text-align:center; border:1px dashed #3b82f6;
}
.price-label { font-size:11.5px; color:#2563eb; margin-bottom:5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
.price { font-size:30px; font-weight:900; color:#1d4ed8; letter-spacing:-1px; }

.features { background:var(--bg-soft); border-radius:14px; padding:16px; margin-bottom:22px; border:1px solid var(--line); }
.features h4 { font-size:14.5px; margin-bottom:12px; font-weight:800; }
.features ul { list-style:none; }
.features li {
    font-size:13.5px; color:var(--muted); margin-bottom:8px;
    display:flex; align-items:center; gap:8px; font-weight:500;
}
.features li::before { content:'✅'; font-size:14px; }
.features li:last-child { margin-bottom:0; }

/* DOWNLOAD BOX */
.download-box {
    background:#ecfdf5; border:1px dashed #10b981; border-radius:14px;
    padding:14px; margin-bottom:14px;
}
.download-label {
    font-size:11.5px; font-weight:800; color:#059669;
    margin-bottom:8px; text-transform:uppercase; letter-spacing:.6px;
}
.download-link {
    display:block; font-size:12.5px; color:#047857; word-break:break-all;
    text-decoration:none; background:#ffffff; padding:10px 12px;
    border-radius:10px; border:1px solid #d1fae5; transition:background .2s;
    font-weight:600;
}
.download-link:hover { background:#f0fdf4; }

.btn-buy {
    width:100%; padding:16px; background:var(--black); color:#fff; border:none;
    border-radius:16px; font-weight:800; font-size:15.5px; display:flex;
    justify-content:center; align-items:center; gap:8px; text-decoration:none;
    cursor:pointer; transition:all .25s cubic-bezier(.4,0,.2,1); position:relative;
    overflow:hidden; letter-spacing:.2px;
}
.btn-buy::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg,transparent 0%,rgba(245,207,72,.18) 100%);
    opacity:0; transition:opacity .3s;
}
.btn-buy:hover::before { opacity:1; }
.btn-buy:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(19,20,24,.3); }
.btn-buy:active { transform:scale(.98); }
.btn-buy.disabled { background:#9ca3af; cursor:not-allowed; }
.btn-buy.disabled:hover { transform:none; box-shadow:none; }

/* NOT FOUND */
.not-found { padding:50px 24px; text-align:center; }
.nf-icon {
    width:80px; height:80px; margin:0 auto 18px; border-radius:24px;
    background:#fee2e2; display:flex; align-items:center; justify-content:center;
    font-size:36px;
}
.not-found h2 { color:#dc2626; margin-bottom:10px; font-size:20px; font-weight:900; }
.not-found p { color:var(--muted); margin-bottom:22px; font-size:14px; line-height:1.6; }
.btn-home {
    display:inline-block; background:var(--black); color:#fff;
    padding:13px 26px; border-radius:13px; text-decoration:none;
    font-weight:800; font-size:14px; transition:transform .2s;
}
.btn-home:hover { transform:translateY(-2px); }

/* LOADING */
.loading { padding:50px; text-align:center; color:var(--muted); font-weight:600; }
.spinner {
    width:36px; height:36px; margin:0 auto 14px;
    border:3px solid var(--line); border-top-color:var(--black);
    border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

@media (min-width:768px) {
    .detail-container { padding:20px; }
    .title { font-size:28px; }
}
</style>
</head>
<body>

<div class="top-nav">
    <a href="index.html" class="btn-back" aria-label="Quay lại">←</a>
    <div class="top-title">Chi tiết File</div>
</div>

<div class="detail-container">
    <div id="detailBox" class="detail-card">
        <div class="loading">
            <div class="spinner"></div>
            Đang tải dữ liệu...
        </div>
    </div>
</div>

<script>
// API nội bộ đọc từ localStorage
const API_SERVER = {
    getAll: () => JSON.parse(localStorage.getItem('PRODUCTS_DATA') || '[]'),
    getById: (id) => API_SERVER.getAll().find(p => String(p.id) === String(id)),
    increaseDownload: (id) => {
        const all = API_SERVER.getAll();
        const p = all.find(x => String(x.id) === String(id));
        if (p) {
            p.downloads = (p.downloads || 0) + 1;
            localStorage.setItem('PRODUCTS_DATA', JSON.stringify(all));
        }
    }
};

function formatNumber(n) { return Number(n || 0).toLocaleString('vi-VN'); }
function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = String(str ?? '');
    return d.innerHTML;
}

function initDetail() {
    const box = document.getElementById('detailBox');
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    if (!id) {
        box.innerHTML = notFoundHTML('Thiếu ID sản phẩm');
        return;
    }

    const p = API_SERVER.getById(id);

    if (!p) {
        box.innerHTML = notFoundHTML('Không tìm thấy File');
        return;
    }

    document.title = p.name + ' - SHOP VIPGONOPRO';

    const fileUrl = (p.fileUrl || '').trim();
    const img = escapeHtml(p.image || '');
    const name = escapeHtml(p.name || 'Sản phẩm');
    const desc = escapeHtml(p.desc || 'File chia sẻ miễn phí.');
    const catLabel = String(p.category || '').toLowerCase().includes('config') ? 'Config' : 'Khác';

    // Khối link tải
    const downloadBlock = fileUrl
        ? `
            <div class="download-box">
                <div class="download-label">🔗 Link tải file</div>
                <a href="${escapeHtml(fileUrl)}" class="download-link" target="_blank" rel="noopener">
                    ${escapeHtml(fileUrl)}
                </a>
            </div>
            <a href="${escapeHtml(fileUrl)}" class="btn-buy" target="_blank" rel="noopener"
               onclick="handleDownload('${escapeHtml(String(p.id))}')">
                ⬇️ TẢI FILE NGAY
            </a>
        `
        : `
            <div class="download-box" style="background:#fef2f2;border-color:#ef4444">
                <div class="download-label" style="color:#dc2626">⚠️ Chưa có link tải</div>
                <div style="font-size:13px;color:#6b7280;line-height:1.6">
                    Admin chưa cập nhật link cho file này. Vui lòng liên hệ Zalo để được hỗ trợ.
                </div>
            </div>
            <a href="https://zalo.me/0849999789" class="btn-buy disabled" target="_blank" rel="noopener">
                💬 Liên hệ Admin
            </a>
        `;

    box.innerHTML = `
        <div class="thumb-wrap">
            <img src="${img}" class="thumb-img" alt="${name}"
                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 375%22%3E%3Crect fill=%22%23151517%22 width=%22600%22 height=%22375%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%23555%22 font-size=%2224%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3ENo Image%3C/text%3E%3C/svg%3E'">

            <div class="free-badge-lg">FREE</div>
        </div>
        <div class="detail-content">
            <div class="tags">
                <span>${catLabel}</span> • <span class="free">Miễn phí 100%</span>
            </div>
            <h1 class="title">${name}</h1>
            <p class="desc">${desc}</p>

            <div class="price-box">
                <div class="price-label">Chia sẻ miễn phí bởi Admin</div>
                <div class="price">0đ</div>
            </div>

            <div class="features">
                <h4>📌 Lưu ý trước khi tải:</h4>
                <ul>
                    <li>File hoàn toàn miễn phí</li>
                    <li>Không Phải Là Aim Nên Đừng Phụ Thuộc</li>
                    <li>Ủng hộ admin qua Zalo nếu thấy hữu ích</li>
                </ul>
            </div>

            ${downloadBlock}
        </div>
    `;
}

function notFoundHTML(msg) {
    return `
        <div class="not-found">
            <div class="nf-icon">😢</div>
            <h2>${msg}</h2>
            <p>File có thể đã bị xoá hoặc đường dẫn không đúng.</p>
            <a href="index.html" class="btn-home">← Về trang chủ</a>
        </div>
    `;
}

function handleDownload(id) {
    try {
        API_SERVER.increaseDownload(id);
        const p = API_SERVER.getById(id);
        const el = document.getElementById('downloadCount');
        if (p && el) {
            el.innerHTML = `⬇ ${formatNumber(p.downloads)} LƯỢT TẢI`;
        }
    } catch (e) { console.error(e); }
}

document.addEventListener('DOMContentLoaded', initDetail);
</script>

</body>
</html>
