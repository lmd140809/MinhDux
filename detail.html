<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07080c">
<title>Chi Tiết File - SHOP MINHDUC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
    --bg:#07080c;
    --bg-2:#0b0d13;
    --surface:#11141c;
    --surface-2:#161a24;
    --surface-3:#1c212e;
    --ink:#f2f4f8;
    --ink-light:#c8cedb;
    --muted:#7b8397;
    --muted-2:#565e72;
    --line:rgba(255,255,255,.06);
    --line-strong:rgba(255,255,255,.12);
    --line-glow:rgba(255,255,255,.18);
    --accent:#eab308;
    --accent-2:#f59e0b;
    --accent-glow:rgba(234,179,8,.35);
    --green:#10b981;
    --green-glow:rgba(16,185,129,.4);
    --cyan:#22d3ee;
    --shadow-sm:0 1px 0 rgba(255,255,255,.04) inset,0 4px 14px rgba(0,0,0,.4);
    --shadow-md:0 1px 0 rgba(255,255,255,.05) inset,0 14px 40px rgba(0,0,0,.5);
    --shadow-lg:0 1px 0 rgba(255,255,255,.06) inset,0 28px 70px rgba(0,0,0,.6);
    --ease:cubic-bezier(.4,0,.2,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
html { scroll-behavior:smooth; }
body {
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    padding-bottom:40px; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    min-height:100vh; position:relative; overflow-x:hidden; line-height:1.5;
}

/* ============ AMBIENT BACKGROUND ============ */
.ambient-bg {
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
    background:
        radial-gradient(1200px 800px at 100% -10%,rgba(234,179,8,.09),transparent 55%),
        radial-gradient(1000px 700px at -10% 110%,rgba(34,211,238,.07),transparent 55%),
        linear-gradient(180deg,#07080c 0%,#0b0d13 100%);
}
.ambient-bg::before {
    content:''; position:absolute; inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 30%,transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 30%,transparent 80%);
}
.blob { position:absolute; border-radius:50%; filter:blur(100px); opacity:.6; animation:float 24s infinite ease-in-out alternate; }
.blob-1 { width:480px; height:480px; background:radial-gradient(circle,rgba(234,179,8,.22),transparent 70%); top:-160px; left:-160px; }
.blob-2 { width:580px; height:580px; background:radial-gradient(circle,rgba(34,211,238,.16),transparent 70%); bottom:12%; right:-240px; animation-delay:-8s; }
@keyframes float { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,-50px) scale(1.08)} 100%{transform:translate(-20px,40px) scale(.92)} }

/* ============ TOP NAV ============ */
.top-nav {
    padding:16px 16px 8px; display:flex; align-items:center; gap:14px;
    max-width:820px; margin:0 auto; position:sticky; top:0; z-index:50;
    background:rgba(7,8,12,.82); backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid transparent;
    transition:border-color .3s;
}
.top-nav.scrolled { border-bottom-color:var(--line); }
.btn-back {
    width:44px; height:44px;
    background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; color:var(--ink); font-size:20px; font-weight:700;
    box-shadow:var(--shadow-sm); border:1px solid var(--line);
    transition:all .25s var(--ease);
}
.btn-back:hover { background:var(--accent); color:#0a0b10; border-color:var(--accent); transform:translateX(-2px); box-shadow:0 8px 24px var(--accent-glow); }
.top-title { font-family:'Sora',sans-serif; font-weight:800; font-size:16px; letter-spacing:-.3px; }
.top-brand { margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.6px; display:flex; align-items:center; gap:6px; }
.top-brand::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

/* ============ CONTAINER ============ */
.detail-container { padding:8px 16px; max-width:820px; margin:0 auto; }
.detail-card {
    background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
    border-radius:26px; overflow:hidden;
    padding-bottom:26px; box-shadow:var(--shadow-md);
    border:1px solid var(--line);
    animation:cardIn .5s var(--ease-spring);
    position:relative;
}
.detail-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
    z-index:3;
}
@keyframes cardIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

/* ============ THUMB ============ */
.thumb-wrap { position:relative; width:100%; aspect-ratio:16/10; background:#0d0f15; border-bottom:1px solid var(--line); overflow:hidden; }
.thumb-img { width:100%; height:100%; object-fit:cover; opacity:.94; transition:transform .7s var(--ease); }
.detail-card:hover .thumb-img { transform:scale(1.03); }
.thumb-wrap::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg,transparent 60%,rgba(17,20,28,.5) 100%);
}
.buyer-badge {
    position:absolute; top:16px; left:16px; z-index:2;
    background:rgba(13,15,21,.85); color:var(--ink);
    padding:8px 12px; border-radius:10px;
    font-size:12px; font-weight:800; backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); letter-spacing:.3px;
    border:1px solid rgba(255,255,255,.1);
    font-family:'JetBrains Mono',monospace;
}
.free-badge-lg {
    position:absolute; top:16px; right:16px; z-index:2;
    background:linear-gradient(135deg,#10b981 0%,#059669 100%);
    color:#fff; padding:7px 11px; border-radius:9px;
    font-size:11px; font-weight:800;
    letter-spacing:.5px;
    font-family:'JetBrains Mono',monospace;
    box-shadow:0 4px 14px var(--green-glow),inset 0 1px 0 rgba(255,255,255,.25);
}

/* ============ CONTENT ============ */
.detail-content { padding:22px; }
.tags { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--muted); margin-bottom:14px; font-weight:600; font-family:'JetBrains Mono',monospace; letter-spacing:.4px; text-transform:uppercase; }
.tags .dot { width:3px; height:3px; border-radius:50%; background:var(--muted-2); }
.tags span.free { color:var(--green); font-weight:800; }
.title { font-family:'Sora',sans-serif; font-size:23px; font-weight:800; margin-bottom:12px; line-height:1.35; letter-spacing:-.6px; color:var(--ink); }
.desc { font-size:14.5px; color:var(--muted); margin-bottom:22px; line-height:1.65; }

.price-box {
    margin-bottom:22px;
    background:linear-gradient(135deg,rgba(234,179,8,.12) 0%,rgba(245,158,11,.06) 100%);
    padding:20px; border-radius:16px; text-align:center;
    border:1px dashed rgba(234,179,8,.4);
    position:relative; overflow:hidden;
}
.price-box::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 0%,rgba(234,179,8,.18),transparent 60%);
    pointer-events:none;
}
.price-label { font-size:11.5px; color:var(--accent); margin-bottom:6px; font-weight:800; letter-spacing:1px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; position:relative; }
.price { font-family:'Sora',sans-serif; font-size:34px; font-weight:900; letter-spacing:-1.5px; background:linear-gradient(135deg,#fde68a 0%,#eab308 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; position:relative; }

.features {
    background:var(--surface-3); border-radius:16px; padding:18px; margin-bottom:22px;
    border:1px solid var(--line);
    position:relative;
}
.features h4 { font-size:14.5px; margin-bottom:14px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; }
.features ul { list-style:none; }
.features li {
    font-size:13.5px; color:var(--ink-light); margin-bottom:10px;
    display:flex; align-items:flex-start; gap:10px; font-weight:500; line-height:1.5;
}
.features li::before {
    content:'✓'; flex-shrink:0;
    width:18px; height:18px; border-radius:50%;
    background:rgba(16,185,129,.16); color:var(--green);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:900;
    margin-top:1px;
    border:1px solid rgba(16,185,129,.3);
}
.features li:last-child { margin-bottom:0; }

/* ============ DOWNLOAD BOX ============ */
.download-box {
    background:linear-gradient(135deg,rgba(16,185,129,.08) 0%,rgba(16,185,129,.03) 100%);
    border:1px dashed rgba(16,185,129,.4);
    border-radius:16px; padding:16px; margin-bottom:14px;
    position:relative;
}
.download-label {
    font-size:11.5px; font-weight:800; color:var(--green);
    margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;
    font-family:'JetBrains Mono',monospace;
    display:flex; align-items:center; gap:6px;
}
.download-link {
    display:block; font-size:12px; color:#34d399; word-break:break-all;
    text-decoration:none; background:rgba(7,8,12,.6); padding:12px 14px;
    border-radius:10px; border:1px solid rgba(16,185,129,.2);
    transition:all .2s var(--ease); font-weight:600;
    font-family:'JetBrains Mono',monospace; line-height:1.5;
}
.download-link:hover { background:rgba(7,8,12,.85); border-color:rgba(16,185,129,.5); color:#6ee7b7; }

/* ============ BUTTON ============ */
.btn-buy {
    width:100%; padding:17px;
    background:linear-gradient(145deg,var(--accent) 0%,var(--accent-2) 100%);
    color:#0a0b10; border:none;
    border-radius:16px; font-weight:900; font-size:15.5px;
    display:flex; justify-content:center; align-items:center; gap:10px;
    text-decoration:none; cursor:pointer;
    transition:all .25s var(--ease);
    position:relative; overflow:hidden;
    letter-spacing:.3px;
    box-shadow:0 8px 24px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3);
    font-family:'Plus Jakarta Sans',sans-serif;
}
.btn-buy::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,.3) 0%,transparent 60%);
    opacity:0; transition:opacity .3s;
}
.btn-buy:hover::before { opacity:1; }
.btn-buy:hover { transform:translateY(-2px); box-shadow:0 14px 34px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3); }
.btn-buy:active { transform:scale(.98); }
.btn-buy.disabled {
    background:linear-gradient(145deg,var(--surface-3) 0%,var(--surface) 100%);
    color:var(--muted); cursor:not-allowed;
    box-shadow:var(--shadow-sm); border:1px solid var(--line);
}
.btn-buy.disabled:hover { transform:none; box-shadow:var(--shadow-sm); }
.btn-buy.disabled::before { display:none; }

/* ============ DOWNLOAD COUNT ============ */
.download-count {
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:800; color:var(--muted);
    font-family:'JetBrains Mono',monospace; letter-spacing:.4px;
    margin-bottom:14px;
    padding:6px 12px; border-radius:8px;
    background:var(--surface-3); border:1px solid var(--line);
}
.download-count::before {
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--green); box-shadow:0 0 8px var(--green);
}

/* ============ NOT FOUND ============ */
.not-found { padding:60px 24px; text-align:center; }
.nf-icon {
    width:88px; height:88px; margin:0 auto 20px; border-radius:26px;
    background:linear-gradient(145deg,rgba(239,68,68,.16) 0%,rgba(239,68,68,.06) 100%);
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
    border:1px solid rgba(239,68,68,.3);
    box-shadow:0 8px 30px rgba(239,68,68,.15);
}
.not-found h2 { color:#f87171; margin-bottom:12px; font-size:20px; font-weight:800; font-family:'Sora',sans-serif; }
.not-found p { color:var(--muted); margin-bottom:24px; font-size:14px; line-height:1.6; }
.btn-home {
    display:inline-block;
    background:linear-gradient(145deg,var(--accent) 0%,var(--accent-2) 100%);
    color:#0a0b10; padding:14px 28px; border-radius:14px;
    text-decoration:none; font-weight:800; font-size:14px;
    transition:all .25s var(--ease);
    box-shadow:0 8px 24px var(--accent-glow);
}
.btn-home:hover { transform:translateY(-2px); box-shadow:0 12px 32px var(--accent-glow); }

/* ============ LOADING ============ */
.loading { padding:60px 24px; text-align:center; color:var(--muted); font-weight:600; }
.spinner {
    width:40px; height:40px; margin:0 auto 16px;
    border:3px solid var(--surface-3);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
    box-shadow:0 0 20px rgba(234,179,8,.2);
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ============ DESKTOP ============ */
@media (min-width:768px) {
    .detail-container { padding:20px; }
    .title { font-size:28px; letter-spacing:-.8px; }
    .detail-content { padding:30px; }
    .price { font-size:40px; }
}
</style>
</head>
<body>

<div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<div class="top-nav" id="topNav">
    <a href="index.html" class="btn-back" aria-label="Quay lại">←</a>
    <div class="top-title">Chi tiết File</div>
    <div class="top-brand">SHOP MINHDUC</div>
</div>

<div class="detail-container">
    <div id="detailBox" class="detail-card">
        <div class="loading">
            <div class="spinner"></div>
            Đang tải dữ liệu...
        </div>
    </div>
</div>

<script>
// API nội bộ đọc từ localStorage
const API_SERVER = {
    getAll: () => JSON.parse(localStorage.getItem('PRODUCTS_DATA') || '[]'),
    getById: (id) => API_SERVER.getAll().find(p => String(p.id) === String(id)),
    increaseDownload: (id) => {
        const all = API_SERVER.getAll();
        const p = all.find(x => String(x.id) === String(id));
        if (p) {
            p.downloads = (p.downloads || 0) + 1;
            localStorage.setItem('PRODUCTS_DATA', JSON.stringify(all));
        }
    }
};

function formatNumber(n) { return Number(n || 0).toLocaleString('vi-VN'); }
function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = String(str ?? '');
    return d.innerHTML;
}

function initDetail() {
    const box = document.getElementById('detailBox');
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    if (!id) {
        box.innerHTML = notFoundHTML('Thiếu ID sản phẩm');
        return;
    }

    const p = API_SERVER.getById(id);

    if (!p) {
        box.innerHTML = notFoundHTML('Không tìm thấy File');
        return;
    }

    document.title = p.name + ' - SHOP MINHDUC';

    const fileUrl = (p.fileUrl || '').trim();
    const img = escapeHtml(p.image || '');
    const name = escapeHtml(p.name || 'Sản phẩm');
    const desc = escapeHtml(p.desc || 'File chia sẻ miễn phí.');
    const catRaw = String(p.category || '').toLowerCase();
    let catLabel = 'Khác';
    if (catRaw === 'regedit') catLabel = 'REGEDIT';
    if (catRaw === 'nhetam') catLabel = 'NHẸ TÂM';
    if (catRaw === 'app') catLabel = 'APP';
    const downloads = formatNumber(p.downloads || 0);

    // Khối link tải
    const downloadBlock = fileUrl
        ? `
            <div class="download-box">
                <div class="download-label">🔗 Link tải file</div>
                <a href="${escapeHtml(fileUrl)}" class="download-link" target="_blank" rel="noopener">
                    ${escapeHtml(fileUrl)}
                </a>
            </div>
            <a href="${escapeHtml(fileUrl)}" class="btn-buy" target="_blank" rel="noopener"
               onclick="handleDownload('${escapeHtml(String(p.id))}')">
                ⬇️ TẢI FILE NGAY
            </a>
        `
        : `
            <div class="download-box" style="background:linear-gradient(135deg,rgba(239,68,68,.08) 0%,rgba(239,68,68,.03) 100%);border-color:rgba(239,68,68,.4)">
                <div class="download-label" style="color:#f87171">⚠️ Chưa có link tải</div>
                <div style="font-size:13px;color:var(--muted);line-height:1.6">
                    Admin chưa cập nhật link cho file này. Vui lòng liên hệ Zalo để được hỗ trợ.
                </div>
            </div>
            <a href="https://zalo.me/0849999789" class="btn-buy disabled" target="_blank" rel="noopener">
                💬 Liên hệ Admin
            </a>
        `;

    box.innerHTML = `
        <div class="thumb-wrap">
            <img src="${img}" class="thumb-img" alt="${name}"
                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 600 375%22%3E%3Crect fill=%22%230d0f15%22 width=%22600%22 height=%22375%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%23565e72%22 font-size=%2222%22 font-family=%22monospace%22 font-weight=%22bold%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3ENO_IMAGE%3C/text%3E%3C/svg%3E'">
            <div class="free-badge-lg">FREE</div>
        </div>
        <div class="detail-content">
            <div class="tags">
                <span>${catLabel}</span>
                <span class="dot"></span>
                <span class="free">Miễn phí 100%</span>
            </div>
            <h1 class="title">${name}</h1>
            <p class="desc">${desc}</p>

            <div class="download-count" id="downloadCount">⬇ ${downloads} LƯỢT TẢI</div>

            <div class="price-box">
                <div class="price-label">Chia sẻ miễn phí bởi Admin</div>
                <div class="price">0đ</div>
            </div>

            <div class="features">
                <h4>📌 Lưu ý trước khi tải:</h4>
                <ul>
                    <li>File hoàn toàn miễn phí</li>
                    <li>Không Phải Là Aim Nên Đừng Phụ Thuộc</li>
                    <li>Ủng hộ admin qua Zalo nếu thấy hữu ích</li>
                </ul>
            </div>

            ${downloadBlock}
        </div>
    `;
}

function notFoundHTML(msg) {
    return `
        <div class="not-found">
            <div class="nf-icon">😢</div>
            <h2>${msg}</h2>
            <p>File có thể đã bị xoá hoặc đường dẫn không đúng.</p>
            <a href="index.html" class="btn-home">← Về trang chủ</a>
        </div>
    `;
}

function handleDownload(id) {
    try {
        API_SERVER.increaseDownload(id);
        const p = API_SERVER.getById(id);
        const el = document.getElementById('downloadCount');
        if (p && el) {
            el.innerHTML = `⬇ ${formatNumber(p.downloads)} LƯỢT TẢI`;
        }
    } catch (e) { console.error(e); }
}

/* Scroll effect cho top nav */
const topNav = document.getElementById('topNav');
window.addEventListener('scroll', () => {
    topNav.classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });

document.addEventListener('DOMContentLoaded', initDetail);
</script>

</body>
</html>
