<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<title>SHOP VIPGONOPRO - Sản phẩm</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
    --bg:#eceff3; --bg-soft:#f5f7fa; --card:#ffffff; --black:#131418;
    --text:#111318; --muted:#7b818c; --line:#e8eaee; --accent:#f5cf48; --green:#10b981;
    --shadow-sm:0 2px 8px rgba(17,19,24,.05);
    --shadow-md:0 8px 24px rgba(17,19,24,.08);
    --shadow-lg:0 20px 48px rgba(17,19,24,.14);
}
html { scroll-behavior:smooth; }
body {
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    padding-bottom:130px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}

/* HEADING */
.page-heading { padding:26px 22px 14px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.page-heading h1 {
    font-size:32px; font-weight:900; letter-spacing:-1.2px; line-height:1.05;
    background:linear-gradient(135deg,#111318 0%,#3a3f4a 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.page-heading p { font-size:13.5px; color:var(--muted); margin-top:8px; font-weight:500; }
.status-pill {
    display:inline-flex; align-items:center; gap:6px; padding:8px 13px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    font-size:11px; font-weight:700; color:var(--muted); box-shadow:var(--shadow-sm); white-space:nowrap;
}
.status-dot {
    width:7px; height:7px; border-radius:50%; background:var(--green);
    box-shadow:0 0 0 3px rgba(16,185,129,.18); animation:pulse 2s infinite;
}
@keyframes pulse {
    0%,100%{box-shadow:0 0 0 3px rgba(16,185,129,.18);}
    50%{box-shadow:0 0 0 6px rgba(16,185,129,.06);}
}

/* STICKY TOP */
.sticky-top {
    position:sticky; top:0; z-index:90; padding:10px 16px 10px;
    background:rgba(236,239,243,.82); backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%); transition:box-shadow .3s;
}
.sticky-top.scrolled { box-shadow:0 8px 28px rgba(17,19,24,.07); }
.header-bar {
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border-radius:22px; padding:14px 16px; min-height:82px;
    border:1px solid var(--line); box-shadow:var(--shadow-sm); transition:box-shadow .3s;
}
.header-bar:hover { box-shadow:var(--shadow-md); }
.brand { display:flex; align-items:center; gap:13px; min-width:0; }
.brand-logo {
    width:52px; height:52px; flex-shrink:0; border-radius:16px;
    background:linear-gradient(135deg,#1a1b20 0%,#2e3038 100%);
    color:var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:900; letter-spacing:-.5px;
    box-shadow:0 6px 16px rgba(19,20,24,.25); position:relative; overflow:hidden;
}
.brand-logo::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg,transparent 40%,rgba(245,207,72,.22) 100%); pointer-events:none;
}
.brand-name { font-size:15px; font-weight:800; white-space:nowrap; letter-spacing:-.3px; }
.brand-sub { font-size:10.5px; color:var(--muted); margin-top:4px; font-weight:600; letter-spacing:.3px; }
.header-actions { display:flex; gap:8px; flex-shrink:0; }
.icon-btn {
    width:42px; height:42px; border-radius:13px; border:1px solid var(--line);
    background:var(--bg-soft); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .25s cubic-bezier(.4,0,.2,1); font-family:inherit;
}
.icon-btn:hover { background:var(--black); color:#fff; border-color:var(--black); transform:translateY(-1px); }
.icon-btn:active { transform:scale(.94); }

/* SEARCH */
.search-bar {
    display:flex; align-items:center; gap:10px; background:var(--card);
    border-radius:16px; padding:14px 16px; margin-top:10px;
    border:1px solid var(--line); box-shadow:var(--shadow-sm);
    transition:all .25s cubic-bezier(.4,0,.2,1);
}
.search-bar:focus-within {
    border-color:var(--black); box-shadow:0 0 0 4px rgba(19,20,24,.06),var(--shadow-md);
}
.search-icon { font-size:16px; opacity:.55; flex-shrink:0; }
.search-bar input {
    width:100%; border:none; outline:none; background:transparent;
    font-family:inherit; font-size:14.5px; font-weight:500; color:var(--text);
}
.search-bar input::placeholder { color:#a7acb5; font-weight:500; }
.clear-btn {
    border:none; background:var(--bg-soft); width:26px; height:26px; border-radius:50%;
    cursor:pointer; font-size:13px; color:var(--muted); display:none;
    align-items:center; justify-content:center; flex-shrink:0; transition:all .2s;
}
.clear-btn.visible { display:flex; }
.clear-btn:hover { background:var(--black); color:#fff; }

/* CATEGORY */
.category-list {
    display:flex; gap:8px; overflow-x:auto; padding:10px 2px 4px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.category-list::-webkit-scrollbar { display:none; }
.category {
    flex-shrink:0; padding:12px 20px; border-radius:14px; background:var(--card);
    border:1px solid var(--line); font-size:13px; font-weight:700; color:#3a3f4a;
    cursor:pointer; font-family:inherit; box-shadow:var(--shadow-sm);
    transition:all .25s cubic-bezier(.4,0,.2,1); display:flex; align-items:center; gap:7px;
}
.category:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
.category.active {
    background:var(--black); color:#fff; border-color:var(--black);
    box-shadow:0 8px 20px rgba(19,20,24,.28); transform:translateY(-1px);
}
.category .cat-count {
    font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px;
    background:var(--bg-soft); color:var(--muted); min-width:22px; text-align:center;
}
.category.active .cat-count { background:rgba(255,255,255,.2); color:#fff; }

/* PRODUCTS */
.product-section { padding:16px 16px 40px; }
.section-title {
    font-size:13.5px; color:var(--muted); margin:4px 4px 16px; font-weight:600;
    display:flex; align-items:center; gap:8px;
}
.section-title strong { color:var(--text); font-weight:800; }
.product-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }

/* PRODUCT CARD */
.product-card {
    background:var(--card); border-radius:24px; padding:10px; border:1px solid var(--line);
    box-shadow:var(--shadow-sm); min-width:0; display:flex; flex-direction:column;
    cursor:pointer; transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s;
    position:relative; overflow:hidden; opacity:0; transform:translateY(14px);
    animation:cardIn .45s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes cardIn { to { opacity:1; transform:translateY(0); } }
.product-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
.product-card:active { transform:scale(.975); }
.card-thumb-wrap {
    width:100%; aspect-ratio:16/11; position:relative; overflow:hidden;
    border-radius:17px; background:#151517; margin-bottom:12px; border:1px solid var(--line);
}
.card-thumb {
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.product-card:hover .card-thumb { transform:scale(1.06); }
.buyer-badge {
    position:absolute; top:8px; left:8px; padding:6px 10px;
    background:rgba(15,16,20,.72); color:#fff; border-radius:9px;
    font-size:9.5px; font-weight:800; letter-spacing:.2px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:4px;
}
.free-badge {
    position:absolute; top:8px; right:8px;
    background:linear-gradient(135deg,#16a36a 0%,#10b981 100%);
    color:#fff; border-radius:8px; padding:5px 9px; font-size:9.5px; font-weight:800;
    letter-spacing:.4px; box-shadow:0 4px 12px rgba(16,185,129,.35);
}
.card-tags {
    display:flex; align-items:center; gap:6px; font-size:10.5px;
    color:var(--muted); margin-bottom:7px; font-weight:600;
}
.card-tags .dot { width:3px; height:3px; border-radius:50%; background:#c4c8d0; }
.card-title {
    font-size:13.5px; font-weight:800; line-height:1.4; min-height:38px; margin-bottom:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; letter-spacing:-.2px;
}
.card-desc {
    font-size:12px; line-height:1.5; color:var(--muted); min-height:36px; margin-bottom:12px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.product-price {
    font-size:17px; font-weight:900; margin-top:auto; margin-bottom:14px; color:var(--text);
    display:flex; align-items:baseline; gap:6px; letter-spacing:-.5px;
}
.product-price::before { content:'0đ'; font-size:17px; }
.product-price .free-tag {
    font-size:10px; font-weight:700; color:var(--green);
    background:rgba(16,185,129,.1); padding:2px 7px; border-radius:6px; margin-left:auto;
}
.btn-view {
    width:100%; min-height:46px; background:var(--black); color:#fff; border:none;
    border-radius:14px; display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; font-family:inherit; font-size:13px; font-weight:700;
    text-decoration:none; transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative; overflow:hidden;
}
.btn-view::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg,transparent 0%,rgba(245,207,72,.16) 100%);
    opacity:0; transition:opacity .3s;
}
.btn-view:hover::before { opacity:1; }
.btn-view:hover { box-shadow:0 8px 20px rgba(19,20,24,.28); transform:translateY(-1px); }
.btn-view span.arrow { font-size:18px; transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
.btn-view:hover span.arrow { transform:translateX(4px); }

/* SKELETON */
.skeleton-card {
    background:var(--card); border-radius:24px; padding:10px;
    border:1px solid var(--line); display:flex; flex-direction:column;
}
.sk-thumb { width:100%; aspect-ratio:16/11; border-radius:17px; margin-bottom:12px; }
.sk-line { height:12px; border-radius:6px; margin-bottom:9px; }
.sk-line.short { width:55%; }
.sk-line.medium { width:78%; }
.shimmer {
    background:linear-gradient(90deg,#eef0f4 25%,#f7f9fc 50%,#eef0f4 75%);
    background-size:200% 100%; animation:shimmer 1.5s infinite;
}
@keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

/* EMPTY */
.empty-state {
    grid-column:1/-1; background:var(--card); border-radius:24px; padding:50px 20px;
    text-align:center; border:1px solid var(--line); box-shadow:var(--shadow-sm);
}
.empty-icon {
    width:72px; height:72px; margin:0 auto 18px; border-radius:22px;
    background:var(--bg-soft); display:flex; align-items:center; justify-content:center;
    font-size:32px; border:1px solid var(--line);
}
.empty-state h3 { font-size:16px; font-weight:800; margin-bottom:8px; }
.empty-state p { font-size:13px; color:var(--muted); line-height:1.6; }
.empty-state button {
    margin-top:18px; padding:11px 22px; background:var(--black); color:#fff;
    border:none; border-radius:12px; font-family:inherit; font-weight:700;
    font-size:13px; cursor:pointer; transition:transform .2s;
}
.empty-state button:hover { transform:translateY(-2px); }

/* BOTTOM NAV */
.bottom-nav-wrap { position:fixed; bottom:14px; left:16px; right:16px; z-index:100; }
.bottom-nav {
    background:rgba(255,255,255,.94); backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.7); border-radius:26px;
    box-shadow:0 12px 36px rgba(17,19,24,.14); display:grid;
    grid-template-columns:repeat(3,1fr); padding:8px; min-height:76px;
}
.nav-item {
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:4px; color:#82888f; font-size:10.5px; font-weight:700;
    text-decoration:none; border-radius:18px; cursor:pointer;
    transition:all .25s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden;
}
.nav-icon { font-size:19px; transition:transform .25s; }
.nav-item:hover .nav-icon { transform:translateY(-2px); }
.nav-item.active { background:var(--black); color:#fff; box-shadow:0 6px 16px rgba(19,20,24,.28); }

/* SCROLL TOP */
.scroll-top {
    position:fixed; bottom:108px; right:18px; width:44px; height:44px;
    border-radius:14px; background:var(--black); color:#fff; border:none;
    font-size:18px; cursor:pointer; box-shadow:var(--shadow-lg);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transform:translateY(12px);
    transition:all .3s cubic-bezier(.4,0,.2,1); z-index:99;
}
.scroll-top.visible { opacity:1; visibility:visible; transform:translateY(0); }
.scroll-top:hover { transform:translateY(-3px); }

/* DESKTOP */
@media (min-width:768px) {
    body { padding-bottom:40px; }
    .page-heading,.sticky-top,.product-section { max-width:1180px; margin-left:auto; margin-right:auto; }
    .page-heading h1 { font-size:40px; }
    .product-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px; }
    .bottom-nav-wrap,.scroll-top { display:none; }
    .card-title { font-size:15px; min-height:42px; }
    .card-desc { font-size:12.5px; }
    .product-price { font-size:19px; }
    .product-price::before { font-size:19px; }
    .product-section { padding-top:24px; }
    .sticky-top { padding-top:14px; }
}

@media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
}
</style>
</head>

<!-- ================= DATA SẢN PHẨM - SỬA TÊN / THÊM Ở ĐÂY ================= -->
<script>
const PRODUCTS = [
    {

        desc: 'HỖ TRỢ KÉO TÂM KHÔNG PHẢI PHẦN MỀM THỨ 3 ',

];

// Lưu vào localStorage để detail.html đọc được
localStorage.setItem('PRODUCTS_DATA', JSON.stringify(PRODUCTS));

// API nội bộ
const API_SERVER = {
    getAll: () => JSON.parse(localStorage.getItem('PRODUCTS_DATA') || '[]'),
    getById: (id) => API_SERVER.getAll().find(p => String(p.id) === String(id)),
    increaseDownload: (id) => {
        const all = API_SERVER.getAll();

        if (p) {
            p.downloads = (p.downloads || 0) + 1;
            localStorage.setItem('PRODUCTS_DATA', JSON.stringify(all));
        }

};
</script>

<script>
let allProducts = [];
let currentCategory = 'all';

function formatNumber(n) { return Number(n || 0).toLocaleString('vi-VN'); }
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str ?? '');
    return div.innerHTML;
}
function skeletonHTML(count = 6) {
    return Array.from({ length: count }).map(() => `
        <div class="skeleton-card">
            <div class="sk-thumb shimmer"></div>
            <div class="sk-line short shimmer"></div>
            <div class="sk-line medium shimmer"></div>
            <div class="sk-line shimmer"></div>
            <div class="sk-line short shimmer"></div>
        </div>
    `).join('');
}

function renderProducts(searchTerm = '') {
    const grid = document.getElementById('productGrid');
    let filtered = allProducts;

    if (currentCategory !== 'all') {
        filtered = filtered.filter(p => {
            const c = String(p.category || '').toLowerCase();
            if (currentCategory === 'config') return c.includes('config');
            return !c.includes('config');
        });
    }

    if (searchTerm.trim()) {
        const kw = searchTerm.toLowerCase().trim();
        filtered = filtered.filter(p =>
            String(p.name || '').toLowerCase().includes(kw) ||
            String(p.desc || '').toLowerCase().includes(kw)
        );
    }

    const countEl = document.getElementById('productCount');
    if (searchTerm.trim()) {
        countEl.innerHTML = `Tìm thấy <strong>${filtered.length}</strong> sản phẩm cho "${escapeHtml(searchTerm)}"`;
    } else {
        countEl.innerHTML = `<strong>${filtered.length}</strong> sản phẩm miễn phí`;
    }

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <h3>Không tìm thấy sản phẩm</h3>
                <p>Thử từ khoá khác hoặc xem tất cả sản phẩm nhé.</p>
                <button onclick="resetFilters()">Xem tất cả sản phẩm</button>
            </div>
        `;
        return;
    }

    grid.innerHTML = filtered.map((p, i) => {
        const id = encodeURIComponent(p.id ?? '');
        const name = escapeHtml(p.name || 'Sản phẩm');
        const desc = escapeHtml(p.desc || 'File chia sẻ miễn phí.');
        const img = escapeHtml(p.image || '');
        const downloads = formatNumber(p.downloads);
        const catLabel = String(p.category || '').toLowerCase().includes('config') ? 'Config' : 'Khác';

        return `
            <article class="product-card" style="animation-delay:${Math.min(i * 40, 300)}ms"
                     onclick="window.location.href='detail.html?id=${id}'">
                <div class="card-thumb-wrap">
                    <img src="${img}" class="card-thumb" alt="${name}" loading="lazy"
                         onerror="this.style.opacity='0.2';this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 250%22%3E%3Crect fill=%22%23151517%22 width=%22400%22 height=%22250%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%23555%22 font-size=%2220%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3ENo Image%3C/text%3E%3C/svg%3E'">

                    <div class="free-badge">FREE</div>
                </div>
                <div class="card-tags">
                    <span>${catLabel}</span>
                    <span class="dot"></span>
                    <span>Miễn phí</span>
                </div>
                <h3 class="card-title">${name}</h3>
                <p class="card-desc">${desc}</p>
                <div class="product-price">
                    <span class="free-tag">FREE</span>
                </div>
                <a href="detail.html?id=${id}" class="btn-view" onclick="event.stopPropagation()">
                    <span>Xem sản phẩm</span>
                    <span class="arrow">→</span>
                </a>
            </article>
        `;
    }).join('');
}

function updateCategoryCounts() {
    const counts = {
        all: allProducts.length,
        config: allProducts.filter(p => String(p.category || '').toLowerCase().includes('config')).length,
        other: allProducts.filter(p => !String(p.category || '').toLowerCase().includes('config')).length,
    };
    document.querySelectorAll('.cat-count').forEach(el => {
        const key = el.dataset.count;
        if (counts[key] !== undefined) el.textContent = counts[key];
    });
}

function resetFilters() {
    currentCategory = 'all';
    document.getElementById('searchInput').value = '';
    document.getElementById('clearBtn').classList.remove('visible');
    document.querySelectorAll('.category').forEach(b => b.classList.toggle('active', b.dataset.category === 'all'));
    renderProducts();
}

document.getElementById('searchInput').addEventListener('input', function () {
    document.getElementById('clearBtn').classList.toggle('visible', this.value.length > 0);
    renderProducts(this.value);
});

document.getElementById('clearBtn').addEventListener('click', function () {
    const input = document.getElementById('searchInput');
    input.value = '';
    this.classList.remove('visible');
    input.focus();
    renderProducts();
});

document.querySelectorAll('.category').forEach(button => {
    button.addEventListener('click', function () {
        document.querySelectorAll('.category').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        currentCategory = this.dataset.category;
        renderProducts(document.getElementById('searchInput').value);
    });
});

document.getElementById('searchNav').addEventListener('click', function () {
    document.getElementById('searchInput').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('refreshBtn').addEventListener('click', function () {
    this.style.transform = 'rotate(360deg)';
    setTimeout(() => { this.style.transform = ''; }, 400);
    loadProducts(true);
});

const stickyTop = document.getElementById('stickyTop');
const scrollTopBtn = document.getElementById('scrollTopBtn');
window.addEventListener('scroll', () => {
    const y = window.scrollY;
    stickyTop.classList.toggle('scrolled', y > 20);
    scrollTopBtn.classList.toggle('visible', y > 400);
}, { passive: true });
scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

function loadProducts(silent = false) {
    const grid = document.getElementById('productGrid');
    if (!silent) grid.innerHTML = skeletonHTML(6);

    try {
        // Đảm bảo localStorage có dữ liệu
        if (!localStorage.getItem('PRODUCTS_DATA')) {
            localStorage.setItem('PRODUCTS_DATA', JSON.stringify(PRODUCTS));
        }
        allProducts = API_SERVER.getAll() || [];
        updateCategoryCounts();
        renderProducts(document.getElementById('searchInput').value);
    } catch (error) {
        console.error('Lỗi tải sản phẩm:', error);
        document.getElementById('productCount').textContent = 'Không thể tải sản phẩm';
        grid.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">⚠️</div>
                <h3>Có lỗi xảy ra</h3>
                <p>Không thể tải danh sách sản phẩm. Vui lòng thử lại.</p>
                <button onclick="loadProducts()">Thử lại</button>
            </div>
        `;
    }
}

document.addEventListener('DOMContentLoaded', () => loadProducts());
</script>

</body>
</html>
