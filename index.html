<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINH DUC — ADMIN DASHBOARD</title>
<style>
  :root { --bg: #0a0508; --card: rgba(255,255,255,0.05); --gold: #ffc733; --red: #ff4d4d; --green: #4ade80; --text: #fff; --sub: #aaa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,199,51,0.2); }
  .header h1 { font-size: 22px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab-btn { flex: 1; padding: 12px; background: var(--card); border: 1px solid rgba(255,199,51,0.2); color: var(--sub); border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .tab-btn.active { background: rgba(255,199,51,0.15); color: var(--gold); border-color: var(--gold); }
  .card { background: var(--card); border: 1px solid rgba(255,199,51,0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: none; }
  .card.active { display: block; }
  .card h2 { font-size: 14px; color: var(--gold); margin-bottom: 15px; }
  label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 5px; font-weight: bold; }
  input[type="text"], input[type="password"], select { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 8px; color: var(--text); font-size: 14px; margin-bottom: 15px; outline: none; }
  input:focus { border-color: var(--gold); }
  .file-upload { border: 2px dashed var(--gold); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; background: rgba(255,199,51,0.05); }
  .file-upload input { display: none; }
  .file-upload p { color: var(--gold); font-size: 13px; font-weight: bold; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
  .btn-upload { background: linear-gradient(135deg, #ffc733, #ffeb99); color: black; }
  .btn:hover { opacity: 0.9; }
  .result { margin-top: 15px; padding: 15px; border-radius: 10px; font-size: 13px; display: none; white-space: pre-wrap; line-height: 1.5; }
  .result.success { background: rgba(74,222,128,0.15); border: 1px solid var(--green); color: var(--green); display: block; }
  .result.error { background: rgba(255,77,77,0.15); border: 1px solid var(--red); color: var(--red); display: block; }
  .release-item { display: flex; justify-content: space-between; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 10px; margin-bottom: 10px; border-left: 3px solid var(--gold); }
  .delete-icon { color: var(--red); cursor: pointer; padding: 8px; background: rgba(255,77,77,0.1); border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>MINH DUC ADMIN</h1></div>

  <div class="card active" style="border-color: var(--red);">
    <h2>🔑 Bảo mật Token</h2>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxx">
    <button class="btn" style="background:#333; color:white;" onclick="saveToken()">LƯU TOKEN</button>
    <p style="font-size:10px; color:#aaa; margin-top:10px;">Mẹo: Thêm <code>?token=ghp_xxx</code> vào sau link web để tự động lưu Token.</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('upload')">📤 Tạo / Sửa File</button>
    <button class="tab-btn" onclick="switchTab('manage')">🗑 Quản lý</button>
  </div>

  <div id="tab-upload" class="card active">
    <h2>📤 Cập nhật & Đổi tên Patch</h2>
    
    <label>Version (Phải tăng dần, VD: 1.0.2)</label>
    <input type="text" id="patchVersion" placeholder="1.0.2">

    <label>Tên hiển thị mới (VD: Aim Head, Siêu Gà...)</label>
    <input type="text" id="patchDisplayName" placeholder="Nhập tên bạn muốn hiện trên App...">
    
    <label>Chọn file cần thay thế</label>
    <select id="patchFilename">
      <option value="OGIOS File (20).3105">AimBody (20)</option>
      <option value="OGIOS File (21).3105">AimLock (21)</option>
      <option value="OGIOS File (22).3105">Antiban (22)</option>
      <option value="OGIOS File (23).3105">Nhẹ Tâm (23)</option>
    </select>

    <div class="file-upload" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept=".3105" onchange="document.getElementById('fileName').textContent = 'Đã chọn: ' + this.files[0].name">
      <p id="fileName">Bấm để chọn file (.3105)</p>
    </div>

    <button class="btn btn-upload" id="btnUpload" onclick="uploadPatch()">TẢI LÊN GITHUB</button>
    <div class="result" id="resultUpload"></div>
  </div>

  <div id="tab-manage" class="card">
    <h2>🗑 Danh sách bản phát hành</h2>
    <div id="releaseList" style="margin-top: 15px;"></div>
    <button class="btn" style="margin-top: 15px; background: #333; color: white;" onclick="loadReleases()">🔄 Tải lại</button>
  </div>
</div>

<script>
  const CONFIG = { owner: "lmd140809", repo: "MinhDux" };
  
  // Tự động lấy Token từ URL nếu có (?token=ghp_xxx)
  const urlParams = new URLSearchParams(window.location.search);
  const urlToken = urlParams.get('token');
  if (urlToken) {
    localStorage.setItem('gh_token', urlToken);
  }

  function saveToken() { 
    const t = document.getElementById('token').value.trim();
    localStorage.setItem('gh_token', t); 
    alert('Đã lưu Token!'); 
  }
  
  function getToken() { return localStorage.getItem('gh_token') || ''; }
  
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.querySelector('.card[style*="red"]').classList.add('active');
    document.getElementById('tab-'+tab).classList.add('active');
    document.querySelector(`.tab-btn[onclick*="${tab}"]`).classList.add('active');
    if(tab === 'manage') loadReleases();
  }
  
  function showResult(msg, type) {
    const el = document.getElementById('resultUpload');
    el.textContent = msg; el.className = `result ${type}`;
  }

  async function uploadPatch() {
    const token = getToken();
    const version = document.getElementById('patchVersion').value.trim();
    const displayName = document.getElementById('patchDisplayName').value.trim();
    const filename = document.getElementById('patchFilename').value;
    const file = document.getElementById('fileInput').files[0];

    if (!token) return showResult("❌ Vui lòng nhập và Lưu Token trước!", "error");
    if (!version || !file) return showResult("❌ Vui lòng nhập Version và chọn file!", "error");

    document.getElementById('btnUpload').disabled = true;
    showResult("⏳ Đang xử lý... Vui lòng đợi!", "success");

    try {
      // 1. Tìm và XOÁ bản Release cũ của file này (nếu có) để tránh lỗi trùng Tag
      const listRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases`, {
        headers: { 
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json' 
        }
      });
      
      if (!listRes.ok) {
          if (listRes.status === 401) throw new Error("Token không hợp lệ hoặc đã hết hạn. Hãy tạo lại Token Classic có quyền 'repo'.");
          throw new Error(`Lỗi kết nối GitHub (Mã: ${listRes.status}). Có thể do mạng chặn API.`);
      }
      
      const releases = await listRes.json();
      
      for (const rel of releases) {
        const hasFile = rel.assets.some(a => a.name === filename);
        if (hasFile) {
          showResult(`⏳ Đang xoá bản cũ (${rel.name}) để thay thế...`, "success");
          await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases/${rel.id}`, {
            method: 'DELETE',
            headers: { 
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
          });
        }
      }

      // 2. Tạo Release mới (Dùng timestamp để không bao giờ trùng Tag)
      const tagName = `patch-${version}-${Date.now()}`;
      const releaseRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases`, {
        method: 'POST',
        headers: { 
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ 
          tag_name: tagName, 
          name: `Patch Update v${version}`, 
          body: displayName || "Cập nhật mới", 
          draft: false, 
          prerelease: false 
        })
      });

      if (!releaseRes.ok) {
        const err = await releaseRes.json();
        throw new Error(err.message || "Lỗi tạo Release (Kiểm tra quyền Token)");
      }
      
      const releaseData = await releaseRes.json();
      
      // 3. Upload file
      showResult("⏳ Đang tải file lên GitHub...", "success");
      const renamedFile = new File([file], filename, { type: file.type });
      const uploadUrl = releaseData.upload_url.replace("{?name,label}", `?name=${encodeURIComponent(filename)}`);
      
      const fileRes = await fetch(uploadUrl, {
        method: 'POST',
        headers: { 
          'Authorization': `token ${token}`, 
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/octet-stream' 
        },
        body: renamedFile
      });

      if (!fileRes.ok) throw new Error("Lỗi upload file lên Release (Có thể do file quá lớn)");

      showResult(`✅ THÀNH CÔNG!\nĐã thay file ${filename}.\nTên mới hiển thị trên App: ${displayName}\nKhách hàng bấm Cập nhật trong App là xong!`, "success");
      
      document.getElementById('patchDisplayName').value = "";
      document.getElementById('fileInput').value = "";
      document.getElementById('fileName').textContent = "Bấm để chọn file (.3105)";

    } catch (err) {
      showResult(`❌ ${err.message}`, "error");
    } finally {
      document.getElementById('btnUpload').disabled = false;
    }
  }

  async function loadReleases() {
    const listEl = document.getElementById('releaseList'); 
    listEl.innerHTML = 'Đang tải...';
    try {
      const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases`, { 
        headers: { 
            'Authorization': `token ${getToken()}`,
            'Accept': 'application/vnd.github.v3+json'
        } 
      });
      if (!res.ok) throw new Error("Lỗi Token");
      
      const data = await res.json();
      if (data.length === 0) {
        listEl.innerHTML = '<p style="color:#aaa; text-align:center;">Chưa có bản phát hành nào</p>';
        return;
      }
      listEl.innerHTML = data.map(r => `
        <div class="release-item">
          <div>
            <h4 style="font-size:13px">${r.name}</h4>
            <p style="font-size:10px;color:#aaa">${r.body || 'Không có tên'}</p>
          </div>
          <div class="delete-icon" onclick="deleteRelease(${r.id})">🗑 Xoá</div>
        </div>`).join('');
    } catch (e) { 
      listEl.innerHTML = '<p style="color:#f87171; text-align:center;">Lỗi kết nối. Kiểm tra lại Token!</p>'; 
    }
  }

  async function deleteRelease(id) {
    if (!confirm("Xoá bản cập nhật này?")) return;
    try {
      await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases/${id}`, { 
        method: 'DELETE', 
        headers: { 
            'Authorization': `token ${getToken()}`,
            'Accept': 'application/vnd.github.v3+json'
        } 
      });
      loadReleases();
    } catch (e) {
      alert("Lỗi xoá!");
    }
  }
  
  window.onload = () => document.getElementById('token').value = getToken();
</script>
</body>
</html>
